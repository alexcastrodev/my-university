name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pizito:5001/university:latest -t pizito:5001/university:${{ github.sha }} .

      - name: Push image
        run: |
          docker push pizito:5001/university:latest
          docker push pizito:5001/university:${{ github.sha }}

      - name: Deploy stack to swarm
        run: ./deploy.sh
