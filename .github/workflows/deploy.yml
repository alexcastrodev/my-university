name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: |
          # web carries the deployed image's lazy chunks over, for tabs still on that build.
          docker pull pizito:5001/university-web:latest || true
          previous_web=no-previous-web
          if docker image inspect pizito:5001/university-web:latest >/dev/null 2>&1; then
            previous_web=pizito:5001/university-web:latest
          fi
          for target in api ssr web; do
            docker build --target "$target" \
              --build-arg SENTRY_RELEASE=${{ github.sha }} \
              --build-arg PREVIOUS_WEB_IMAGE="$previous_web" \
              -t "pizito:5001/university-$target:latest" \
              -t "pizito:5001/university-$target:${{ github.sha }}" .
          done

      - name: Push images
        run: |
          for target in api ssr web; do
            docker push "pizito:5001/university-$target:latest"
            docker push "pizito:5001/university-$target:${{ github.sha }}"
          done

      - name: Deploy stack to swarm
        run: ./deploy.sh

      # Tells Sentry about the deploy: the release is marked as released and gets a production
      # deploy, which is what makes "resolved in next release" and regression detection work.
      # The site is already live here, so a Sentry outage or a missing token must not fail the run.
      # Commits are not attached: that needs the GitHub integration installed on the Sentry side.
      - name: Register release in Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          api=https://us.sentry.io/api/0/organizations/kutz/releases
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -fsS -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"version\":\"${{ github.sha }}\",\"projects\":[\"university-api\",\"university-web\"],\"dateReleased\":\"$now\"}" \
            "$api/"
          curl -fsS -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" -H 'Content-Type: application/json' \
            -d '{"environment":"production"}' \
            "$api/${{ github.sha }}/deploys/"
