name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  TEST_STACK: university-ci-${{ github.run_id }}
  TEST_COMPOSE: -f docker-compose.yml -f .ci/compose.test.yml --profile test

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A throwaway copy of the whole stack (web/api/ssr + postgres + meilisearch) built from
      # this commit; the backend specs run against it through nginx. Nothing deploys unless
      # they pass.
      - name: Run backend specs
        run: |
          docker compose -p "$TEST_STACK" $TEST_COMPOSE up --build \
            --attach console-test --abort-on-container-exit --exit-code-from console-test \
            console-test

      - name: Tear down test stack
        if: always()
        run: docker compose -p "$TEST_STACK" $TEST_COMPOSE down -v --rmi local --remove-orphans

  build-and-deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: |
          for target in api ssr web; do
            docker build --target "$target" \
              -t "pizito:5001/university-$target:latest" \
              -t "pizito:5001/university-$target:${{ github.sha }}" .
          done

      - name: Push images
        run: |
          for target in api ssr web; do
            docker push "pizito:5001/university-$target:latest"
            docker push "pizito:5001/university-$target:${{ github.sha }}"
          done

      - name: Deploy stack to swarm
        run: ./deploy.sh
