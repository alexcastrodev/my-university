name: Security scan

# Static checks that run on every PR (and weekly, to catch rules and advisories published later):
# secrets in the diff and history, CodeQL on the TypeScript code, the three container images (OS packages and
# anything else baked in), and config guards for hardening that is easy to undo. Dependency advisories already in the lockfiles are covered by security-audit.yml;
# the dependency-review job below blocks a PR that adds or bumps a dependency to a vulnerable version.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The image is pinned by tag and run directly: the marketplace action needs a license key
      # for organisations. Allowlist and rationale live in .gitleaks.toml.
      - name: Scan history
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.0 \
            detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    # It compares the PR against its base, so it only runs on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHSA-vfj7-8cjw-p6xm (braces) has no fixed version and is accepted in pnpm-workspace.yaml,
      # so a PR that touches it is not blocked for it.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          license-check: false
          allow-ghsas: GHSA-vfj7-8cjw-p6xm

  config-guards:
    name: Config guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cheap regression tests for hardening that is easy to undo by accident.
      - name: nginx sends the security headers from every location that sets add_header
        run: |
          set -euo pipefail
          # A location with its own add_header drops inherited ones, so it must include the snippet.
          python3 - <<'PY'
          import re, sys
          conf = open('nginx.conf').read()
          bad = [m.group(0).split('{')[0].strip()
                 for m in re.finditer(r"    location [^\n]*\{\n(?:(?!\n    \}).)*\n    \}", conf, re.S)
                 if 'add_header' in m.group(0) and 'security-headers.conf' not in m.group(0)]
          server_head = conf.split('server {')[1].split('    location ')[0]
          if 'include /etc/nginx/snippets/security-headers.conf;' not in server_head:
              bad.append('server block')
          if bad:
              sys.exit('missing security-headers include in: ' + ', '.join(bad))
          PY
          for h in X-Content-Type-Options X-Frame-Options Referrer-Policy Permissions-Policy Content-Security-Policy; do
            grep -q "add_header $h " security-headers.conf || { echo "security-headers.conf lacks $h"; exit 1; }
          done

      - name: Scripts stay nonce-only in the CSP
        run: |
          set -euo pipefail
          policy=$(grep -E "^\s+default \"default-src" nginx.conf)
          script_src=$(echo "$policy" | grep -oE "script-src[^;]*")
          echo "$script_src"
          case "$script_src" in *unsafe-inline*|*unsafe-eval*) echo "script-src must not allow unsafe-inline/unsafe-eval"; exit 1;; esac
          echo "$script_src" | grep -q "nonce-" || { echo "script-src lost its nonce"; exit 1; }
          # The nonce is only useful if the SSR locations stamp it on the inline scripts.
          [ "$(grep -c "sub_filter '<script'" nginx.conf)" -ge 2 ] || { echo "SSR locations must stamp the nonce"; exit 1; }

      - name: Dev login shortcuts stay opt-in
        run: |
          set -euo pipefail
          # Controllers must go through assertDevAuth()/devAuthEnabled(), never a bare NODE_ENV check.
          if grep -n "NODE_ENV" backend/src/auth/auth.controller.ts; then
            echo "auth.controller.ts must use dev-auth.ts, not NODE_ENV"; exit 1
          fi
          if grep -n "ENABLE_DEV_AUTH" Dockerfile deploy.sh .github/workflows/deploy.yml; then
            echo "ENABLE_DEV_AUTH must never be set for production images or deploys"; exit 1
          fi

      # The PDF reader runs untrusted files in the visitor's browser, so its engine is a deliberate choice (#189).
      - name: PDF engine is pinned and runs with its dangerous features off
        run: |
          set -euo pipefail
          # An exact version: a range would let an install pick up an unreviewed release of the parser.
          version=$(node -p "require('./app/package.json').dependencies['pdfjs-dist']")
          echo "pdfjs-dist $version"
          echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "pdfjs-dist must be pinned to an exact version"; exit 1; }
          grep -q "enableXfa: false" app/src/app/pages/papers/pdf-engine.ts || { echo "pdf-engine.ts must keep XFA off"; exit 1; }
          if grep -nE "enableScripting: *true|isEvalSupported: *true" app/src/app/pages/papers/pdf-engine.ts; then
            echo "PDF scripting and eval must stay off"; exit 1
          fi

      - name: A PDF is only served from the route that checks the owner, with its sandbox headers
        run: |
          set -euo pipefail
          f=backend/src/paper-attachments/paper-attachments.controller.ts
          for h in "X-Content-Type-Options" "Content-Security-Policy" "Cache-Control" "Content-Disposition"; do
            grep -q "'$h'" "$f" || { echo "the file route lost $h"; exit 1; }
          done
          grep -q "default-src 'none'; sandbox" "$f" || { echo "the file route must keep its sandbox CSP"; exit 1; }
          grep -q "attachment; filename" "$f" || { echo "a PDF must be served as an attachment"; exit 1; }
          # The only SQL that returns an approved object key is the owner-scoped one.
          [ "$(grep -rn "v.state = 'approved'" backend/src/paper-attachments/paper-attachments.service.ts | wc -l)" -ge 1 ] || { echo "approved-only check is gone"; exit 1; }

      - name: Uploads keep their size and rate limits in nginx
        run: |
          set -euo pipefail
          for zone in upload_rl library_rl upload_total upload_conn; do
            grep -q "zone=$zone\|zone $zone" nginx.conf || grep -q "$zone" nginx.conf || { echo "nginx lost $zone"; exit 1; }
          done
          # Both upload routes carry the body limit and the rate limit.
          python3 - <<'PY'
          import re, sys
          conf = open('nginx.conf').read()
          blocks = [m.group(0) for m in re.finditer(r"    location [^\n]*\{\n(?:(?!\n    \}).)*\n    \}", conf, re.S) if 'client_max_body_size' in m.group(0)]
          if len(blocks) < 2:
              sys.exit('expected the two upload locations')
          for b in blocks:
              for need in ('limit_req zone=upload_rl', 'limit_conn upload_total', 'limit_conn upload_conn'):
                  if need not in b:
                      sys.exit('an upload location lost: ' + need)
          PY

  images:
    name: Container images (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails on a HIGH or CRITICAL finding that has a fix. Unfixed ones are not actionable by us, and the weekly
      # run picks up a fix as soon as the base image has it. The scanner is pinned by tag, like gitleaks above.
      - name: Build the images
        run: |
          for target in api ssr web; do
            docker build --target "$target" -t "scan-$target" .
          done

      - name: Scan the images
        run: |
          for target in api ssr web; do
            echo "== $target"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
              --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "scan-$target"
          done
