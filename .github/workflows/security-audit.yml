name: Security audit

# Fails when any dependency (frontend workspace or backend) has a published
# advisory that isn't patched or explicitly accepted in `auditConfig.ignoreGhsas`
# (pnpm-workspace.yaml / backend/pnpm-workspace.yaml). The weekly run catches
# advisories published after a lockfile was last touched.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm audit reads the lockfile directly, so no install is needed.
      - name: Audit frontend workspace
        run: pnpm audit --audit-level low

      - name: Audit backend
        working-directory: backend
        run: pnpm audit --audit-level low
