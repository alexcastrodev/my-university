services:
  web:
    image: pizito:5001/university:latest
    environment:
      - NODE_ENV=production
      - SESSION_SECRET
      - DATABASE_URL=postgres://postgres@university-db_postgres:5432/ocp_java
      - MEILI_HOST=http://university-db_meilisearch:7700
      - MEILI_MASTER_KEY
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - GITHUB_CALLBACK_URL
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        order: start-first
      resources:
        limits:
          cpus: '1'
          memory: 1G

networks:
  proxy_net:
    external: true
