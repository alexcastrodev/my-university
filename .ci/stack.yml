# Three services built from the targets in .ci/Dockerfile. `web` keeps its name, port and
# proxy_net attachment, so the external reverse proxy still reaches it as before; api and ssr
# sit behind it. Upstreams use full `university_*` names because short ones can collide on the
# shared proxy_net.
services:
  web:
    image: pizito:5001/university-web:latest
    environment:
      - API_UPSTREAM=university_api:3000
      - SSR_UPSTREAM=university_ssr:4000
    networks:
      - proxy_net
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        order: start-first
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  api:
    image: pizito:5001/university-api:latest
    environment:
      - NODE_ENV=production
      # Every boot builds the whole search index in memory (the full text of every concept, ~3.4k
      # documents) and the content grows with each batch. Node's default heap for this container is
      # ~256 MB and the boot peak reached it ("JavaScript heap out of memory", exit 134), which also
      # made Swarm roll back an update. The limit below leaves room for the larger heap plus native memory.
      - NODE_OPTIONS=--max-old-space-size=448
      - SESSION_SECRET
      - DATABASE_URL=postgres://postgres@university-db_postgres:5432/ocp_java
      - MEILI_HOST=http://university-db_meilisearch:7700
      - MEILI_MASTER_KEY
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - GITHUB_CALLBACK_URL
      # Object storage: the shared SeaweedFS (stack `bucket`, S3 API on 8333) reached over proxy_net by
      # its full service name. Only the keys are secret (they come from the host .env, like the ones
      # above); the `university` identity is limited to the university-papers bucket in its s3.json.
      - S3_ENDPOINT=http://bucket_seaweedfs:8333
      - S3_BUCKET=university-papers
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      # Error and performance reporting (Sentry project kutz/university-api). A DSN is not a
      # secret, it only lets clients send events; set here, and nowhere else, so only production reports.
      - SENTRY_DSN=https://ead6bcc0a9533ee44b1aabcf93268f8d@o4509399654989824.ingest.us.sentry.io/4512158423187456
    # proxy_net to reach university-db (postgres/meilisearch); internal for web.
    networks:
      - proxy_net
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        order: start-first
      resources:
        limits:
          cpus: '1'
          memory: 768M

  ssr:
    image: pizito:5001/university-ssr:latest
    environment:
      - NODE_ENV=production
      # Through nginx (not straight to api) so SSR renders hit its anonymous content cache.
      - SSR_API_ORIGIN=http://university_web
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
      rollback_config:
        order: start-first
      resources:
        limits:
          cpus: '1'
          memory: 512M

networks:
  proxy_net:
    external: true
  internal:
    driver: overlay
