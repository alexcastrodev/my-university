services:
  postgres:
    image: postgres:18-alpine
    volumes:
      - /mnt/ssd/@docker/university/db:/var/lib/postgresql
    environment:
      - POSTGRES_DB=ocp_java
      - POSTGRES_HOST_AUTH_METHOD=trust
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G

  meilisearch:
    image: getmeili/meilisearch:v1.56.2
    volumes:
      - /mnt/ssd/@docker/university/meili:/meili_data
    environment:
      - MEILI_MASTER_KEY
      - MEILI_NO_ANALYTICS=true
      # New DB directory instead of migrating: the index is rebuilt from the content on
      # every app boot, so the old v1.11 data.ms is simply left unused.
      - MEILI_DB_PATH=/meili_data/data-v1.56.ms
      - MEILI_ENV=production
    networks:
      - proxy_net
    deploy:
      replicas: 1
      resources:
        limits:
          # 0.5 made a 4200-document upload take ~75s, and the task queue is serial: two replicas
          # rebuilding at once need ~150s for the second one.
          cpus: '1.5'
          # 512M was not enough: it idles near 320M, and an index rebuild builds the new
          # generation next to the old one, so it was OOM-killed (exit 137) on deploys.
          memory: 1G

networks:
  proxy_net:
    external: true
