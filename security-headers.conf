# Included by the server block and by every location that sets its own add_header (nginx drops
# inherited add_header directives as soon as a location declares one). TLS ends at the proxy in
# front of this container, and that proxy already sends HSTS (so it is not repeated here).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# The policy (and its per-request script nonce) is built in nginx.conf (`$csp_policy`): no
# 'unsafe-inline' for scripts, everything else closed: no plugins, no foreign frames, forms and
# <base> pinned to this origin, connections only to this origin and Sentry.
add_header Content-Security-Policy $csp_policy always;
