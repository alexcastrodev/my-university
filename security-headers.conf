# Included by the server block and by every location that sets its own add_header (nginx drops
# inherited add_header directives as soon as a location declares one). TLS ends at the proxy in
# front of this container, so HSTS is emitted here and only takes effect over HTTPS.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# script-src keeps 'unsafe-inline' because Angular SSR emits inline bootstrap scripts; moving to
# nonces is the upgrade path. Everything else is closed: no plugins, no foreign frames, forms and
# <base> pinned to this origin, connections only to this origin and Sentry.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.ingest.us.sentry.io; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
