  <script>
    // Runs before Angular bootstraps / first paint, so the saved theme applies
    // immediately instead of flashing light then switching to dark. Mirrors
    // ThemeService's own localStorage key; kept in sync manually since this
    // script must run standalone, before any app code is loaded.
    (function () {
      try {
        if (localStorage.getItem('preferred-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
