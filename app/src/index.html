  <script>
    // Runs before Angular bootstraps / first paint, so the saved theme applies
    // immediately instead of flashing light then switching to dark. Mirrors
    // ThemeService's own localStorage key; kept in sync manually since this
    // script must run standalone, before any app code is loaded.
    (function () {
      try {
        if (localStorage.getItem('preferred-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <script>
    // Same idea for the sidebar: apply a saved collapse choice before first paint so the
    // layout doesn't jump. Mirrors the 'sidebar-collapsed' key used by the Sidebar component.
    (function () {
      try {
        var saved = localStorage.getItem('sidebar-collapsed');
        if (saved === '1' || saved === '0') {
          document.documentElement.setAttribute('data-sidebar', saved === '1' ? 'collapsed' : 'expanded');
        }
      } catch (e) {}
    })();
  </script>
