@if (trophies().length > 0) {
  <section aria-labelledby="trophies-title">
    <h2 id="trophies-title" class="section-title" i18n="@@publicProfile.trophies">Trophies</h2>
    <ul class="cards">
      @for (award of trophies(); track award.id) {
        <li><app-award-tile [award]="award" /></li>
      }
    </ul>
  </section>
}

@if (badges().length > 0) {
  <section aria-labelledby="badges-title">
    <h2 id="badges-title" class="section-title" i18n="@@publicProfile.badges">Badges</h2>
    <ul class="cards">
      @for (award of badges(); track award.id) {
        <li><app-award-tile [award]="award" /></li>
      }
    </ul>
  </section>
}
