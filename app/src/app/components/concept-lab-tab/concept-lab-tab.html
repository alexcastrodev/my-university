<section class="lab-hero">
  <div class="lab-hero-text">
    <h2 class="lab-title" i18n="@@lab.title">Hands-on lab</h2>
    <p class="lab-sub" i18n="@@lab.subtitle">Practice this concept on real code, then come back to compare notes.</p>
  </div>
  <div class="lab-actions">
    <a class="lab-cta" [href]="labUrl()" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
      <span i18n="@@lab.open">Open lab</span>
    </a>
    <button
      type="button"
      class="lab-done-btn"
      [class.done]="done()"
      [class.locked]="!auth.currentUser()"
      [disabled]="!auth.currentUser()"
      [attr.aria-pressed]="done()"
      [attr.title]="!auth.currentUser() ? finishLockedTitle : null"
      (click)="toggleDone()"
    >
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      @if (done()) {
        <span i18n="@@lab.finishedDone">Lab finished</span>
      } @else {
        <span i18n="@@lab.finish">I finished the lab</span>
      }
    </button>
  </div>
</section>

@if (labHtml(); as html) {
  <div class="lab-body" [innerHTML]="html"></div>
}

<app-concept-discussion kind="lab" [topic]="topic()" />
