@if (!hidden()) {
  <nav class="bottom-nav" role="navigation" aria-label="Primary" i18n-aria-label="@@bottomNav.aria">
    <a
      [routerLink]="homeLink()"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="tab"
      i18n-aria-label="@@bottomNav.home"
      aria-label="Home"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 9.5V20h14V9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span i18n="@@bottomNav.home">Home</span>
    </a>

    <a
      routerLink="/daily"
      routerLinkActive="active"
      class="tab"
      i18n-aria-label="@@bottomNav.daily"
      aria-label="Daily"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M13 8l-4 5h3l-1 3 4-5h-3l1-3z" fill="currentColor"/>
      </svg>
      <span i18n="@@bottomNav.daily">Daily</span>
    </a>

    <a
      routerLink="/computer-science"
      routerLinkActive="active"
      class="tab"
      i18n-aria-label="@@bottomNav.track"
      aria-label="Track"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 19V9M12 19V5M19 19v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span i18n="@@bottomNav.track">Track</span>
    </a>

    <a
      routerLink="/feed"
      routerLinkActive="active"
      class="tab"
      i18n-aria-label="@@bottomNav.feed"
      aria-label="Feed"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="6" y="3" width="12" height="18" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M9.5 8h5M9.5 11.5h5M9.5 15h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span i18n="@@bottomNav.feed">Feed</span>
    </a>

    <a
      routerLink="/settings"
      routerLinkActive="active"
      class="tab"
      i18n-aria-label="@@bottomNav.settings"
      aria-label="Settings"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span i18n="@@bottomNav.settings">Settings</span>
    </a>
  </nav>
}
