<nav class="breadcrumbs" [attr.aria-label]="'breadcrumbs.ariaLabel' | t">
  <a routerLink="/" class="breadcrumb-link">{{ 'breadcrumbs.home' | t }}</a>
  @for (item of items(); track item.path; let last = $last) {
    <span class="breadcrumb-sep" aria-hidden="true">/</span>
    @if (last) {
      <span class="breadcrumb-current" aria-current="page">{{ item.name }}</span>
    } @else {
      <a [routerLink]="item.path" class="breadcrumb-link">{{ item.name }}</a>
    }
  }
</nav>
