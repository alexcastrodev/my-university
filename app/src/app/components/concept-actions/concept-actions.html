<div class="concept-actions">
  <button
    class="got-it-btn"
    [class.completed]="read()"
    [class.locked]="!auth.currentUser()"
    [disabled]="!auth.currentUser() || read() || marking()"
    [attr.title]="!auth.currentUser() ? 'Log in to mark this ' + lockedLabel() + ' as read' : null"
    [attr.aria-label]="!auth.currentUser() ? 'Log in to mark this ' + lockedLabel() + ' as read' : null"
    (click)="onMarkRead()"
    type="button"
  >
    @if (!auth.currentUser()) {
      <span aria-hidden="true">🔒</span>
    }
    @if (read()) {
      ⚡ Got it +10 XP
    } @else {
      ⚡ Got it!
    }
  </button>
  @if (labUrl()) {
    <a [href]="labUrl()" target="_blank" rel="noopener noreferrer" class="lab-link-btn">
      🔬 Open Lab
    </a>
  }
</div>
