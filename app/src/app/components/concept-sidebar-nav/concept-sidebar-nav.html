<aside class="sidebar-nav" i18n-aria-label="@@concept.sidebarNav.ariaLabel" aria-label="Concept navigation">
  <div class="sidebar-progress">
    <span class="sidebar-progress-label">{{ 'concept.sidebarNav.readCount' | t:{ count: readCount(), total: items().length } }}</span>
    <div class="sidebar-progress-track">
      <div class="sidebar-progress-fill" [style.width.%]="progressPercent()"></div>
    </div>
  </div>

  <ol class="concept-list" role="list">
    @for (item of items(); track item.slug) {
      <li>
        <a
          class="concept-item"
          [class.active]="activeSlug() === item.slug"
          [routerLink]="[basePath(), item.slug]"
        >
          <span class="status-dot" [class.read]="item.read" aria-hidden="true">
            @if (item.read) {
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none">
                <path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            }
          </span>
          <span class="concept-item-info">
            <span class="concept-item-title">{{ item.label }}</span>
            @if (item.badge) {
              <span class="concept-item-badge">{{ item.badge }}</span>
            }
          </span>
        </a>
      </li>
    }
  </ol>
</aside>
