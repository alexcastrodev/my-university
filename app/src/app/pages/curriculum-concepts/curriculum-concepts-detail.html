<div class="page">
  <div class="page-body">
    @if (loading()) {
      <a [routerLink]="basePath()" class="back-link">← {{ disciplineTitle() }}</a>
      <div class="loading" role="status" aria-label="Loading concept">
        <span class="spinner" aria-hidden="true"></span>
        Loading concept…
      </div>
    } @else if (notFound()) {
      <a [routerLink]="basePath()" class="back-link">← {{ disciplineTitle() }}</a>
      <div class="not-found">
        <p>Concept not found.</p>
      </div>
    } @else {
      <app-concept-detail-layout
        [backHref]="basePath()"
        [backLabel]="disciplineTitle()"
        [basePath]="basePath()"
        [items]="sidebarItems()"
        [activeSlug]="nav.slug()"
        [prevItem]="prevItem()"
        [nextItem]="nextItem()"
      >
        <app-curriculum-concept-view
          [concept]="concept()"
          [read]="read()"
          [marking]="marking()"
          [breadcrumbs]="breadcrumbItems()"
          [basePath]="basePath()"
          (markRead)="onMarkRead()"
        />
      </app-concept-detail-layout>
    }
  </div>
</div>
