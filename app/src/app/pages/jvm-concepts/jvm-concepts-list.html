<div class="page">
  <div class="page-hero">
    <h1 class="page-title" i18n="@@jvmConcepts.title">JVM Concepts</h1>
    <p class="page-sub" i18n="@@jvmConcepts.subtitle">How the JVM works under the hood, one concept at a time.</p>
  </div>

  <div class="page-body">
    <div class="filters-row">
      <button type="button" class="labs-filter-btn"
        [class.active]="showOnlyLabs()"
        (click)="onToggleLabsFilter()" i18n="@@concepts.filters.labsOnly">🔬 Labs only</button>
    </div>

    <div class="sort-row">
      <span class="sort-row-label" i18n="@@concepts.sort.label">Sort</span>
      <div class="sort-filters">
        @for (opt of READ_SORT_OPTIONS; track opt.value) {
          <button type="button" class="sort-filter-pill"
            [class.active]="readSort() === opt.value"
            (click)="onSortChange(opt.value)">
            {{ opt.label | t }}
          </button>
        }
      </div>
      <app-concept-view-toggle />
    </div>

    @if (loading()) {
      <div class="loading" role="status" i18n-aria-label="@@concepts.loading.ariaLabel" aria-label="Loading concepts">
        <span class="spinner" aria-hidden="true"></span>
        {{ 'concepts.loading' | t }}
      </div>
    } @else {
      <app-concept-card-list [items]="filteredConcepts()" [routeCommands]="ROUTE_COMMANDS" />
    }
  </div>
</div>
