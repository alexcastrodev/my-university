<div class="page">
  <div class="page-body">
    @if (loading()) {
      <a routerLink="/java/java-concepts" class="back-link">← Java Concepts</a>
      <div class="loading" role="status" aria-label="Loading concept">
        <span class="spinner" aria-hidden="true"></span>
        Loading concept…
      </div>
    } @else if (notFound()) {
      <a routerLink="/java/java-concepts" class="back-link">← Java Concepts</a>
      <div class="not-found">
        <p>Concept not found.</p>
      </div>
    } @else {
      <app-concept-detail-layout
        backHref="/java/java-concepts"
        backLabel="Java Concepts"
        basePath="/java/java-concepts"
        [items]="sidebarItems()"
        [activeSlug]="nav.slug()"
        [prevItem]="prevItem()"
        [nextItem]="nextItem()"
      >
        <app-java-concept-view
          [concept]="concept()"
          [read]="read()"
          [marking]="marking()"
          (markRead)="onMarkRead()"
        />
      </app-concept-detail-layout>
    }
  </div>
</div>
