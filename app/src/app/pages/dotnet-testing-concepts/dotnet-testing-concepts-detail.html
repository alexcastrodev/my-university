<div class="page">
  <div class="page-body">
    @if (loading()) {
      <a routerLink="/dotnet-testing-concepts" class="back-link">← {{ backLabelText }}</a>
      <div class="loading" role="status" i18n-aria-label="@@dotnetTestingConceptsDetail.loading.ariaLabel" aria-label="Loading concept">
        <span class="spinner" aria-hidden="true"></span>
        <ng-container i18n="@@dotnetTestingConceptsDetail.loading">Loading concept…</ng-container>
      </div>
    } @else if (notFound()) {
      <a routerLink="/dotnet-testing-concepts" class="back-link">← {{ backLabelText }}</a>
      <div class="not-found">
        <p i18n="@@dotnetTestingConceptsDetail.notFound">Concept not found.</p>
      </div>
    } @else {
      <app-concept-detail-layout
        backHref="/dotnet-testing-concepts"
        [backLabel]="backLabelText"
        basePath="/dotnet-testing-concepts"
        [items]="sidebarItems()"
        [activeSlug]="nav.slug()"
        [prevItem]="prevItem()"
        [nextItem]="nextItem()"
      >
        <app-dotnet-testing-concept-view
          [concept]="concept()"
          [read]="read()"
          [marking]="marking()"
          [breadcrumbs]="breadcrumbItems()"
          (markRead)="onMarkRead()"
        />
      </app-concept-detail-layout>
    }
  </div>
</div>
