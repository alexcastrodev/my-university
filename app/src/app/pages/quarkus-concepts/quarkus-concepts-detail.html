<div class="page">
  <div class="page-body">
    @if (loading()) {
      <a routerLink="/quarkus-concepts" class="back-link">← {{ 'quarkusConcepts.title' | t }}</a>
      <div class="loading" role="status" [attr.aria-label]="'quarkusConceptsDetail.loading.ariaLabel' | t">
        <span class="spinner" aria-hidden="true"></span>
        {{ 'quarkusConceptsDetail.loading' | t }}
      </div>
    } @else if (notFound()) {
      <a routerLink="/quarkus-concepts" class="back-link">← {{ 'quarkusConcepts.title' | t }}</a>
      <div class="not-found">
        <p>{{ 'quarkusConceptsDetail.notFound' | t }}</p>
      </div>
    } @else {
      <app-concept-detail-layout
        backHref="/quarkus-concepts"
        [backLabel]="'quarkusConcepts.title' | t"
        basePath="/quarkus-concepts"
        [items]="sidebarItems()"
        [activeSlug]="nav.slug()"
        [prevItem]="prevItem()"
        [nextItem]="nextItem()"
      >
        <app-quarkus-concept-view
          [concept]="concept()"
          [read]="read()"
          [marking]="marking()"
          [breadcrumbs]="breadcrumbItems()"
          (markRead)="onMarkRead()"
        />
      </app-concept-detail-layout>
    }
  </div>
</div>
