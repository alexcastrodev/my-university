<div class="page">
  <div class="page-body">
    @if (loading()) {
      <a routerLink="/rubyonrails-concepts" class="back-link">← {{ 'rubyonrailsConcepts.title' | t }}</a>
      <div class="loading" role="status" [attr.aria-label]="'rubyonrailsConceptsDetail.loading.ariaLabel' | t">
        <span class="spinner" aria-hidden="true"></span>
        {{ 'rubyonrailsConceptsDetail.loading' | t }}
      </div>
    } @else if (notFound()) {
      <a routerLink="/rubyonrails-concepts" class="back-link">← {{ 'rubyonrailsConcepts.title' | t }}</a>
      <div class="not-found">
        <p>{{ 'rubyonrailsConceptsDetail.notFound' | t }}</p>
      </div>
    } @else {
      <app-concept-detail-layout
        backHref="/rubyonrails-concepts"
        [backLabel]="'rubyonrailsConcepts.title' | t"
        basePath="/rubyonrails-concepts"
        [items]="sidebarItems()"
        [activeSlug]="nav.slug()"
        [prevItem]="prevItem()"
        [nextItem]="nextItem()"
      >
        <app-rubyonrails-concept-view
          [concept]="concept()"
          [read]="read()"
          [marking]="marking()"
          [breadcrumbs]="breadcrumbItems()"
          (markRead)="onMarkRead()"
        />
      </app-concept-detail-layout>
    }
  </div>
</div>
