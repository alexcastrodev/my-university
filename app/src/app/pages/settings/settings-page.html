<div class="page">
  <div class="page-body">
    @if (!auth.currentUser()) {
      <div class="login-prompt">
        <p i18n="@@settings.loginPrompt">Log in with GitHub to change your settings.</p>
        <a class="btn github-btn" href="/api/auth/github" i18n="@@profile.continueGithub">Continue with GitHub</a>
      </div>
    } @else {
      <h1 class="page-title" i18n="@@settings.title">Settings</h1>

      <div class="card">
        <h2 class="section-title" i18n="@@settings.displayName.title">Display name</h2>
        <p class="hint">
          {{ 'settings.displayName.hint' | t: { login: auth.currentUser()!.githubLogin } }}
        </p>

        <input
          class="name-input"
          type="text"
          [value]="displayName()"
          (input)="displayName.set($any($event.target).value)"
          maxlength="80"
          i18n-aria-label="@@settings.displayName.ariaLabel" aria-label="Display name"
        />

        <div class="actions">
          <button type="button" class="btn primary-btn" [disabled]="saving()" (click)="save()">@if (saving()) { <ng-container i18n="@@settings.saving">Saving…</ng-container> } @else { <ng-container i18n="@@settings.save">Save</ng-container> }</button>
          <button type="button" class="btn secondary-btn" [disabled]="saving()" (click)="resetToGithubName()" i18n="@@settings.resetGithub">Reset to GitHub name</button>
        </div>

        @if (message(); as msg) {
          <p class="feedback" [class.error]="msg.kind === 'error'">{{ msg.text }}</p>
        }
      </div>

      <div class="card">
        <h2 class="section-title" i18n="@@settings.theme.title">Theme</h2>
        <p class="hint" i18n="@@settings.theme.comingSoon">Coming soon.</p>
        <button type="button" class="btn secondary-btn" disabled i18n="@@settings.theme.darkMode">Dark mode</button>
      </div>
    }
  </div>
</div>
