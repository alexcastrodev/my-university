<div class="page">
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z" fill="#c74634"/>
        <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z" fill="#c74634" opacity=".7"/>
      </svg>
    </div>
    <h1 class="title" i18n="@@loginPage.title">Welcome</h1>
    <p class="subtitle" i18n="@@loginPage.subtitle">Sign in to track your progress and XP</p>

    @if (error()) {
      <p class="error-msg" role="alert" i18n="@@loginPage.error">Something went wrong signing in with GitHub. Please try again.</p>
    }

    <a class="btn github-btn" href="/api/auth/github">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <ng-container i18n="@@loginPage.cta.github">Continue with GitHub</ng-container>
    </a>

    @if (devModeEnabled()) {
      <button class="btn dev-btn" type="button" [disabled]="devLoggingIn()" (click)="devLogin()">@if (devLoggingIn()) { <ng-container i18n="@@loginPage.cta.devSigningIn">Signing in…</ng-container> } @else { <ng-container i18n="@@loginPage.cta.devUser">Continue as Dev User (local only)</ng-container> }</button>
    }
  </div>
</div>
