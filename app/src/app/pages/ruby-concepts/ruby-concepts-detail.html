<div class="page">
  <div class="page-body">
    @if (loading()) {
      <a routerLink="/ruby-concepts" class="back-link">← {{ 'rubyConcepts.title' | t }}</a>
      <div class="loading" role="status" [attr.aria-label]="'rubyConceptsDetail.loading.ariaLabel' | t">
        <span class="spinner" aria-hidden="true"></span>
        {{ 'rubyConceptsDetail.loading' | t }}
      </div>
    } @else if (notFound()) {
      <a routerLink="/ruby-concepts" class="back-link">← {{ 'rubyConcepts.title' | t }}</a>
      <div class="not-found">
        <p>{{ 'rubyConceptsDetail.notFound' | t }}</p>
      </div>
    } @else {
      <app-concept-detail-layout
        backHref="/ruby-concepts"
        [backLabel]="'rubyConcepts.title' | t"
        basePath="/ruby-concepts"
        [items]="sidebarItems()"
        [activeSlug]="nav.slug()"
        [prevItem]="prevItem()"
        [nextItem]="nextItem()"
      >
        <app-ruby-concept-view
          [concept]="concept()"
          [read]="read()"
          [marking]="marking()"
          [breadcrumbs]="breadcrumbItems()"
          (markRead)="onMarkRead()"
        />
      </app-concept-detail-layout>
    }
  </div>
</div>
