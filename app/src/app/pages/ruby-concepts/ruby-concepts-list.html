<div class="page">
  <div class="page-hero">
    <h1 class="page-title">{{ 'rubyConcepts.title' | t }}</h1>
    <p class="page-sub">{{ 'rubyConcepts.subtitle' | t }}</p>
  </div>

  <div class="page-body">
    <div class="filters-row">
      <button type="button" class="labs-filter-btn"
        [class.active]="showOnlyLabs()"
        (click)="onToggleLabsFilter()">
        {{ 'concepts.filters.labsOnly' | t }}
      </button>
    </div>

    <div class="sort-row">
      <span class="sort-row-label">{{ 'concepts.sort.label' | t }}</span>
      <div class="sort-filters">
        @for (opt of READ_SORT_OPTIONS; track opt.value) {
          <button type="button" class="sort-filter-pill"
            [class.active]="readSort() === opt.value"
            (click)="onSortChange(opt.value)">
            {{ opt.label | t }}
          </button>
        }
      </div>
      <app-concept-view-toggle />
    </div>

    @if (loading()) {
      <div class="loading" role="status" [attr.aria-label]="'concepts.loading.ariaLabel' | t">
        <span class="spinner" aria-hidden="true"></span>
        {{ 'concepts.loading' | t }}
      </div>
    } @else {
      @for (group of groupedConcepts(); track group.topic) {
        <section class="topic-group">
          <h2 class="topic-heading">{{ group.topic }}</h2>
          <app-concept-card-list [items]="group.concepts" [routeCommands]="ROUTE_COMMANDS" />
        </section>
      }
    }
  </div>
</div>
