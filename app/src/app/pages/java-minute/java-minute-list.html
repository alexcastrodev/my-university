<div class="page">
  <div class="page-hero">
    <h1 class="page-title">Minuto Java</h1>
    <p class="page-sub">Respostas rápidas para perguntas comuns sobre Java, um episódio por vez.</p>
  </div>

  <div class="page-body">
    @if (loading()) {
      <div class="loading" role="status" aria-label="Loading episodes">
        <span class="spinner" aria-hidden="true"></span>
        Carregando episódios…
      </div>
    } @else {
      <div class="cards-grid">
        @for (episode of episodes(); track episode.slug) {
          <a [routerLink]="['/java-minute', episode.slug]" class="episode-card">
            <div class="card-header">
              <span class="card-order">#{{ episode.order }}</span>
              <span class="card-date">{{ episode.publishedAt }}</span>
            </div>
            <h3 class="card-title">{{ episode.question }}</h3>
            <div class="card-footer">
              <span class="card-cta">Assistir →</span>
            </div>
          </a>
        }
      </div>
    }
  </div>
</div>
