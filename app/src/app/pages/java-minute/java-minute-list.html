<div class="page">
  <div class="page-hero">
    <h1 class="page-title">Java Minute</h1>
    <p class="page-sub">Quick answers to common Java questions, one episode at a time.</p>
  </div>

  <div class="page-body">
    @if (loading()) {
      <div class="loading" role="status" aria-label="Loading episodes">
        <span class="spinner" aria-hidden="true"></span>
        Loading episodes…
      </div>
    } @else {
      <div class="cards-grid">
        @for (episode of episodes(); track episode.slug) {
          <a [routerLink]="['/java/java-minute', episode.slug]" class="episode-card">
            <div class="card-header">
              <div class="card-badges">
                <span class="card-order">#{{ episode.id }}</span>
                @if (episode.read) {
                  <span class="card-badge read-badge" title="You've watched this episode">✓ Watched</span>
                }
              </div>
              <span class="card-date">{{ episode.publishedAt }}</span>
            </div>
            <h3 class="card-title">{{ episode.question }}</h3>
            <div class="card-footer">
              <span class="card-cta">Watch →</span>
            </div>
          </a>
        }
      </div>
    }
  </div>
</div>
