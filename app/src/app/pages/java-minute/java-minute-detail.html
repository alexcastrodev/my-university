<div class="page">
  <div class="page-body">
    @if (loading()) {
      <a [routerLink]="basePath" class="back-link">← Java Minute</a>
      <div class="loading" role="status" aria-label="Loading episode">
        <span class="spinner" aria-hidden="true"></span>
        Loading episode…
      </div>
    } @else if (notFound()) {
      <a [routerLink]="basePath" class="back-link">← Java Minute</a>
      <div class="not-found">
        <p>Episode not found.</p>
      </div>
    } @else {
      <app-concept-detail-layout
        [backHref]="basePath"
        backLabel="Java Minute"
        [basePath]="basePath"
        [items]="sidebarItems()"
        [activeSlug]="nav.slug()"
        [prevItem]="prevItem()"
        [nextItem]="nextItem()"
      >
        <app-java-minute-episode
          [episode]="episode()"
          [read]="read()"
          [marking]="marking()"
          [breadcrumbs]="breadcrumbItems()"
          [fallbackNotice]="showFallbackNotice()"
          (markRead)="onMarkRead()"
        />
      </app-concept-detail-layout>
    }
  </div>
</div>
