<div class="page">
  <div class="page-body">
    @if (loading()) {
      <a [routerLink]="basePath" class="back-link">← {{ 'javaMinute.title' | t }}</a>
      <div class="loading" role="status" [attr.aria-label]="'javaMinuteDetail.loading.ariaLabel' | t">
        <span class="spinner" aria-hidden="true"></span>
        {{ 'javaMinuteDetail.loading' | t }}
      </div>
    } @else if (notFound()) {
      <a [routerLink]="basePath" class="back-link">← {{ 'javaMinute.title' | t }}</a>
      <div class="not-found">
        <p>{{ 'javaMinuteDetail.notFound' | t }}</p>
      </div>
    } @else {
      <app-concept-detail-layout
        [backHref]="basePath"
        [backLabel]="'javaMinute.title' | t"
        [basePath]="basePath"
        [items]="sidebarItems()"
        [activeSlug]="nav.slug()"
        [prevItem]="prevItem()"
        [nextItem]="nextItem()"
      >
        <app-java-minute-episode
          [episode]="episode()"
          [read]="read()"
          [marking]="marking()"
          [breadcrumbs]="breadcrumbItems()"
          [fallbackNotice]="showFallbackNotice()"
          (markRead)="onMarkRead()"
        />
      </app-concept-detail-layout>
    }
  </div>
</div>
