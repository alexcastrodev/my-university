<div class="page">
  <div class="page-body">
    <a routerLink="/java-minute" class="back-link">← Java Minute</a>

    @if (loading()) {
      <div class="loading" role="status" aria-label="Loading episode">
        <span class="spinner" aria-hidden="true"></span>
        Loading episode…
      </div>
    } @else if (notFound()) {
      <div class="not-found">
        <p>Episode not found.</p>
      </div>
    } @else {
      <app-java-minute-episode [episode]="episode()" />
    }
  </div>
</div>
