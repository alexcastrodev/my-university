<div class="page">
  <h1 class="title" i18n="@@studies.title">Study</h1>
  <p class="sub" i18n="@@studies.subtitle">Choose where to go next.</p>

  <div class="grid">
    <a class="card" routerLink="/tracks">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h7"/></svg>
      </span>
      <h2 class="name" i18n="@@header.nav.tracks">Tracks</h2>
      <p class="desc" i18n="@@studies.tracks.desc">Java, Spring, .NET, Ruby and more, concept by concept.</p>
    </a>

    <a class="card" routerLink="/exams">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>
      </span>
      <h2 class="name" i18n="@@header.nav.certifications">Certifications</h2>
      <p class="desc" i18n="@@studies.certifications.desc">Practice exams for Oracle Java and Microsoft Azure.</p>
    </a>

    <a class="card" routerLink="/papers">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7V3z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>
      </span>
      <h2 class="name" i18n="@@header.nav.papers">Papers</h2>
      <p class="desc" i18n="@@studies.papers.desc">Research papers to read and discuss.</p>
    </a>

    <a class="card" routerLink="/computer-science">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V9M12 19V5M19 19v-7"/></svg>
      </span>
      <h2 class="name" i18n="@@header.nav.computerScience">Computer Science</h2>
      <p class="desc" i18n="@@studies.computerScience.desc">The full curriculum, from foundations to specialization.</p>
    </a>
  </div>
</div>
