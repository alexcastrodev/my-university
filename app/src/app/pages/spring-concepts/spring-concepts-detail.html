<div class="page">
  <div class="page-body">
    @if (loading()) {
      <a [routerLink]="basePath" class="back-link">← {{ 'springConcepts.title' | t }}</a>
      <div class="loading" role="status" i18n-aria-label="@@springConceptsDetail.loading.ariaLabel" aria-label="Loading concept">
        <span class="spinner" aria-hidden="true"></span>
        {{ 'springConceptsDetail.loading' | t }}
      </div>
    } @else if (notFound()) {
      <a [routerLink]="basePath" class="back-link">← {{ 'springConcepts.title' | t }}</a>
      <div class="not-found">
        <p i18n="@@springConceptsDetail.notFound">Concept not found.</p>
      </div>
    } @else {
      <app-concept-detail-layout
        [backHref]="basePath"
        [backLabel]="'springConcepts.title' | t"
        [basePath]="basePath"
        [items]="sidebarItems()"
        [activeSlug]="nav.slug()"
        [prevItem]="prevItem()"
        [nextItem]="nextItem()"
      >
        <app-spring-concept-view
          [concept]="concept()"
          [read]="read()"
          [marking]="marking()"
          [breadcrumbs]="breadcrumbItems()"
          [fallbackNotice]="showFallbackNotice()"
          (markRead)="onMarkRead()"
        />
      </app-concept-detail-layout>
    }
  </div>
</div>
