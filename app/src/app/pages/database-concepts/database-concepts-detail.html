<div class="page">
  <div class="page-body">
    <a routerLink="/databases/database-concepts" class="back-link">← Database Concepts</a>

    @if (loading()) {
      <div class="loading" role="status" aria-label="Loading concept">
        <span class="spinner" aria-hidden="true"></span>
        Loading concept…
      </div>
    } @else if (notFound()) {
      <div class="not-found">
        <p>Concept not found.</p>
      </div>
    } @else {
      <app-database-concept-view
        [concept]="concept()"
        [read]="read()"
        [marking]="marking()"
        (markRead)="onMarkRead()"
      />
    }
  </div>
</div>
