<div class="page">
  <div class="page-hero">
    <h1 class="page-title" i18n="@@algorithmsConcepts.title">Algorithms</h1>
    <p class="page-sub" i18n="@@algorithmsConcepts.subtitle">Classic algorithms and data structures — from Sedgewick and Cormen, explained in depth.</p>
  </div>

  <div class="page-body">
    <div class="filters-row">
      <div class="category-filters">
        @for (opt of CATEGORY_OPTIONS; track opt.value) {
          <button type="button" class="category-filter-pill"
            [class.active]="selectedCategory() === opt.value"
            (click)="onFilterChange(opt.value)">
            @switch (opt.label) {
    @case ('concepts.filters.all') { <ng-container i18n="@@concepts.filters.all">All</ng-container> }
    @case ('algorithmsConcepts.category.fundamentals') { <ng-container i18n="@@algorithmsConcepts.category.fundamentals">Fundamentals</ng-container> }
    @case ('algorithmsConcepts.category.sorting') { <ng-container i18n="@@algorithmsConcepts.category.sorting">Sorting</ng-container> }
    @case ('algorithmsConcepts.category.dataStructures') { <ng-container i18n="@@algorithmsConcepts.category.dataStructures">Data Structures</ng-container> }
    @case ('algorithmsConcepts.category.graphs') { <ng-container i18n="@@algorithmsConcepts.category.graphs">Graphs</ng-container> }
    @case ('algorithmsConcepts.category.strings') { <ng-container i18n="@@algorithmsConcepts.category.strings">Strings</ng-container> }
    @case ('algorithmsConcepts.category.dynamicProgrammingGreedy') { <ng-container i18n="@@algorithmsConcepts.category.dynamicProgrammingGreedy">Dynamic Programming &amp; Greedy</ng-container> }
    }
          </button>
        }
      </div>
      <button type="button" class="labs-filter-btn"
        [class.active]="showOnlyLabs()"
        (click)="onToggleLabsFilter()" i18n="@@concepts.filters.labsOnly">🔬 Labs only</button>
    </div>

    <div class="sort-row">
      <span class="sort-row-label" i18n="@@concepts.sort.label">Sort</span>
      <div class="sort-filters">
        @for (opt of READ_SORT_OPTIONS; track opt.value) {
          <button type="button" class="sort-filter-pill"
            [class.active]="readSort() === opt.value"
            (click)="onSortChange(opt.value)">
            @switch (opt.label) {
    @case ('sort.default') { <ng-container i18n="@@sort.default">Default</ng-container> }
    @case ('sort.unreadFirst') { <ng-container i18n="@@sort.unreadFirst">Unread first</ng-container> }
    @case ('sort.readFirst') { <ng-container i18n="@@sort.readFirst">Read first</ng-container> }
    }
          </button>
        }
      </div>
      <app-concept-view-toggle />
    </div>

    @if (loading()) {
      <div class="loading" role="status" i18n-aria-label="@@concepts.loading.ariaLabel" aria-label="Loading concepts">
        <span class="spinner" aria-hidden="true"></span>
        {{ 'concepts.loading' | t }}
      </div>
    } @else {
      <app-concept-card-list [items]="filteredConcepts()" [routeCommands]="ROUTE_COMMANDS" />
    }
  </div>
</div>
