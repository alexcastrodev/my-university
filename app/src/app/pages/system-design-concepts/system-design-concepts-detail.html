<div class="page">
  <div class="page-body">
    @if (loading()) {
      <a [routerLink]="basePath" class="back-link">← System Design</a>
      <div class="loading" role="status" aria-label="Loading concept">
        <span class="spinner" aria-hidden="true"></span>
        Loading concept…
      </div>
    } @else if (notFound()) {
      <a [routerLink]="basePath" class="back-link">← System Design</a>
      <div class="not-found">
        <p>Concept not found.</p>
      </div>
    } @else {
      <app-concept-detail-layout
        [backHref]="basePath"
        backLabel="System Design"
        [basePath]="basePath"
        [items]="sidebarItems()"
        [activeSlug]="nav.slug()"
        [prevItem]="prevItem()"
        [nextItem]="nextItem()"
      >
        <app-system-design-concept-view
          [concept]="concept()"
          [read]="read()"
          [marking]="marking()"
          [allConcepts]="nav.allConcepts()"
          [breadcrumbs]="breadcrumbItems()"
          [fallbackNotice]="showFallbackNotice()"
          (markRead)="onMarkRead()"
        />
      </app-concept-detail-layout>
    }
  </div>
</div>
