# Rendered by the official nginx image's envsubst step (copied to
# /etc/nginx/templates/default.conf.template): only ${API_UPSTREAM} and ${SSR_UPSTREAM} are
# substituted, nginx's own $variables are left alone. They're host:port of the `api` and `ssr`
# services, e.g. `api:3000` under Compose, the full `university_api:3000` under Swarm (short
# names can collide on the shared proxy_net, where another stack already has a `web`).

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Responses that are identical for every visitor and costly to produce (the sharp-rendered OG
# PNG, the sitemap that walks every track) are cached here, so a crawler burst never reaches Node.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=200m inactive=7d use_temp_path=off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/markdown
    application/json
    application/javascript
    application/xml
    image/svg+xml;

server_tokens off;

server {
    listen 80;

    # Docker's embedded DNS. Upstreams go through variables so they're resolved per request
    # (re-checked every 10s) instead of once at startup: nginx then boots even while api/ssr
    # are still starting, and follows them when Swarm reschedules.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    set $ssr_upstream ${SSR_UPSTREAM};

    # nginx itself, for the container healthcheck: deliberately independent of api/ssr, so a
    # slow API boot never gets the proxy restarted.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/content/ {
        alias /public/content/;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /api/og {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache api_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /sitemap.xml {
        proxy_pass http://$api_upstream/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache api_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Built browser assets are served straight from disk; only paths that aren't a file fall
    # through to the SSR server. Rendered HTML comes from SSR as `no-store`.
    location / {
        root /usr/share/nginx/html;
        try_files $uri @ssr;
        add_header Cache-Control "public, max-age=31536000";
    }

    location @ssr {
        proxy_pass http://$ssr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
