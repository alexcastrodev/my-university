# Rendered by the official nginx image's envsubst step (copied to
# /etc/nginx/templates/default.conf.template): only ${API_UPSTREAM} and ${SSR_UPSTREAM} are
# substituted, nginx's own $variables are left alone. They're host:port of the `api` and `ssr`
# services, e.g. `api:3000` under Compose, the full `university_api:3000` under Swarm (short
# names can collide on the shared proxy_net, where another stack already has a `web`).

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Responses that are identical for every visitor and costly to produce (the sharp-rendered OG
# PNG, the sitemap that walks every track) are cached here, so a crawler burst never reaches Node.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=200m inactive=7d use_temp_path=off;

# Content-Security-Policy with a per-request script nonce. `$request_id` is 128 random bits and is
# also what the SSR locations below stamp on every inline <script> (sub_filter), so only the
# scripts nginx itself served in this response can run. style-src keeps 'unsafe-inline': Angular
# component styles are injected at runtime, and style injection is a far smaller risk than script.
map $request_id $csp_policy {
    default "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.ingest.us.sentry.io; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/markdown
    application/json
    application/javascript
    application/xml
    image/svg+xml;

server_tokens off;

# Real client IP. Requests arrive from the external nginx-proxy over the overlay network, which
# appends to X-Forwarded-For (e.g. "client, 172.18.0.1"); trusting only private ranges and
# walking the header right to left yields the address that proxy actually saw, not whatever a
# client chose to send. Used by the rate limits below and by the logs / X-Real-IP to the API.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per-client limits for the endpoints that cost real work per call or are abuse targets. Sized
# well above normal use (search is debounced in the header; OG images are fetched a few at a
# time by link-preview crawlers), so only floods get a 429.
limit_req_zone $binary_remote_addr zone=search_rl:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=og_rl:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=10r/m;
# Writes are limited per IP; reads (empty key) are not. The app already caps
# comments per account, so this only slows one address that spreads over many accounts. The burst
# is generous on purpose: the backend spec suite writes from a single address through this nginx.
map $request_method $write_key {
    GET     "";
    HEAD    "";
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone $write_key zone=discussion_rl:10m rate=60r/m;
# Everything a reader writes to their library (adding and importing papers, notes, annotations, shares,
# collections) is limited per IP too, above what a person does by hand: it stops a script that floods the
# API (and, through the import, the DOI provider), and the per-account caps do the rest. The burst is
# large because the Playwright suite writes from a single address through this nginx (about 550 writes in a
# minute for the papers specs).
limit_req_zone $write_key zone=library_rl:10m rate=300r/m;
# PDF uploads are the only large request bodies. Only the upload itself (PUT) is limited. The rate is the real
# limit; the burst is generous on purpose, because the Playwright suite uploads from a single address through
# this nginx, in several browsers one after the other (about 120 uploads in a minute for the papers specs).
# The bucket refills at the rate, so two full runs of the suite within a minute of each other can still meet
# a 429: wait a minute, or restart the web container, which empties the zones.
map $request_method $upload_key {
    PUT     $binary_remote_addr;
    default "";
}
limit_req_zone $upload_key zone=upload_rl:10m rate=20r/m;
limit_req_status 429;
# Each upload is held in the API's memory (up to 25 MiB) while it is read and checked, and the API runs with a
# small memory limit. So the uploads in flight at once are capped, in total and per address, and the rest are
# answered 429 instead of being queued.
limit_conn_zone $server_name zone=upload_total:1m;
limit_conn_zone $binary_remote_addr zone=upload_conn:10m;
limit_conn_status 429;

server {
    listen 80;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS. Upstreams go through variables so they're resolved per request
    # (re-checked every 10s) instead of once at startup: nginx then boots even while api/ssr
    # are still starting, and follows them when Swarm reschedules.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    set $ssr_upstream ${SSR_UPSTREAM};

    # nginx itself, for the container healthcheck: deliberately independent of api/ssr, so a
    # slow API boot never gets the proxy restarted.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/content/ {
        alias /public/content/;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /api/og {
        limit_req zone=og_rl burst=20 nodelay;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache api_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Content reads (concept tracks, Java Minute, curriculum, courses) are the same for every
    # anonymous visitor, and that's also every SSR render (the SSR server calls the API through
    # here without the user's cookies). A request carrying the session cookie gets per-user
    # `read`/progress flags, so it always goes to the API and is never stored. The cache lives in
    # the container, so each deploy starts it empty.
    location ~ ^/api/(?:[a-z]+(?:-[a-z]+)*-concepts|java-minute|csharp-minute|curriculum|courses)(?:/|$) {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache api_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1h;
        proxy_cache_bypass $cookie_uid;
        proxy_no_cache $cookie_uid;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /api/search {
        limit_req zone=search_rl burst=30 nodelay;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Discussions are never cached (they change by the minute and carry per-reader flags), and
    # writes are rate limited. Kept out of the cached concept routes above on purpose.
    location ^~ /api/discussions {
        limit_req zone=discussion_rl burst=150 nodelay;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # A reader's private PDF for a paper. The one route with a large body, so it alone raises the limit;
    # keep it above PAPER_PDF_MAX_BYTES (25 MiB by default) or nginx answers 413 before the API can.
    # Reading, downloading and deleting go through the generic /api/ block below. Papers are addressed by their
    # public id: the slug of a public paper (#213) or the UUID of a private one (#202), and a UUID is also made of
    # lowercase letters, digits and hyphens, so one pattern covers both. It used to name only the UUID, and an
    # upload to a public paper then met the 1 MB default and no rate limit.
    location ~* "^/api/papers/[a-z0-9-]{1,100}/attachment$" {
        client_max_body_size 26m;
        limit_req zone=upload_rl burst=400 nodelay;
        limit_conn upload_total 8;
        limit_conn upload_conn 6;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # A paper added by dropping a PDF (#203) carries the same large body, so it gets the same limit and rate.
    location = /api/paper-library/private {
        client_max_body_size 26m;
        limit_req zone=upload_rl burst=400 nodelay;
        limit_conn upload_total 8;
        limit_conn upload_conn 6;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The reader's library: adding, importing, notes, annotations, shares and collections. Reads are not limited.
    # The upload route above is an exact match and keeps its own, stricter limit and body size.
    location ^~ /api/paper-library {
        limit_req zone=library_rl burst=3000 nodelay;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The GitHub OAuth start + callback: each one is a round trip to GitHub.
    location ^~ /api/auth/github {
        limit_req zone=auth_rl burst=10 nodelay;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /sitemap.xml {
        proxy_pass http://$api_upstream/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache api_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The web app manifest keeps a fixed URL, so it can't take the year-long cache below: browsers
    # re-read it to pick up new names and icons for the installed PWA.
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Public learner profiles are reachable by link and never indexed. The page is rendered in the
    # browser and reads /api/profile (answered `no-store`); this only adds the header crawlers honour,
    # which the HTML meta tag alone cannot guarantee for a client-rendered route. The optional first
    # segment is the locale sub path (`/pt-BR/u/<id>`). Not access control: privacy is the API's 404.
    # The pattern is quoted because nginx treats an unquoted `{` in a regex as a block start.
    location ~ "^/(?:[a-z]{2}(?:-[A-Za-z]{2})?/)?u/[^/]+/?$" {
        proxy_pass http://$ssr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # The nonce for the CSP header (see $csp_policy): stamped on every <script> of the rendered
        # page. The upstream must answer uncompressed for sub_filter to see the HTML.
        proxy_set_header Accept-Encoding "";
        sub_filter '<script' '<script nonce="$request_id"';
        sub_filter_once off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The PDF reader's engine (#185): its worker, fonts and decoders, copied next to the app by the build. They
    # keep fixed URLs, so they are revalidated instead of cached for a year like the hashed files: the worker has to
    # be the same version as the engine in the page's bundle, and a stale copy after an upgrade would refuse to run.
    # `.mjs` is not in the stock MIME table, and a browser refuses a module worker that is not served as JavaScript.
    # The optional first segment is the locale sub path. The pattern is quoted because of the `{`.
    location ~ "^/(?:[a-z]{2}(?:-[A-Za-z]{2})?/)?pdfjs/" {
        root /usr/share/nginx/html;
        include /etc/nginx/mime.types;
        types { application/javascript mjs; }
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Built browser assets are served straight from disk; only paths that aren't a file fall
    # through to the SSR server. Rendered HTML comes from SSR as `no-store`.
    location / {
        root /usr/share/nginx/html;
        try_files $uri @ssr;
        add_header Cache-Control "public, max-age=31536000";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location @ssr {
        proxy_pass http://$ssr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # The nonce for the CSP header (see $csp_policy): stamped on every <script> of the rendered
        # page. The upstream must answer uncompressed for sub_filter to see the HTML.
        proxy_set_header Accept-Encoding "";
        sub_filter '<script' '<script nonce="$request_id"';
        sub_filter_once off;
    }
}
