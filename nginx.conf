map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Responses that are identical for every visitor and costly to produce (the sharp-rendered OG
# PNG, the sitemap that walks every track) are cached here, so a crawler burst never reaches Node.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=200m inactive=7d use_temp_path=off;

# gzip_vary and server_tokens off already come from Alpine's base nginx.conf.
gzip on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/markdown
    application/json
    application/javascript
    application/xml
    image/svg+xml;

server {
    listen 80;

    location /api/content/ {
        alias /public/content/;
        add_header Content-Type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /api/og {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache api_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /sitemap.xml {
        proxy_pass http://localhost:3000/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache api_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Built browser assets are served straight from disk; only paths that aren't a file fall
    # through to the SSR server. Same headers the SSR's express.static used to send, so a
    # deploy doesn't change caching behavior. Rendered HTML still comes from SSR as `no-store`.
    location / {
        root /app/frontend/browser;
        try_files $uri @ssr;
        add_header Cache-Control "public, max-age=31536000";
    }

    location @ssr {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
