services:
  app:
    build: .
    ports:
      - "80:80"
    environment:
      - NODE_ENV=development
      - SESSION_SECRET
      - DATABASE_URL=postgres://postgres@postgres:5432/ocp_java
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - GITHUB_CALLBACK_URL
      - FRONTEND_URL
    depends_on:
      - meilisearch
      - postgres

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=ocp_java
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      - MEILI_MASTER_KEY
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data

  console-test:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      - API_URL=http://app/api
      - CI=true
    command: sh -c "corepack enable && corepack prepare pnpm@11.3.0 --activate && pnpm install --frozen-lockfile && pnpm spec"
    depends_on:
      - app
    profiles:
      - test

volumes:
  postgres_data:
  meili_data:
