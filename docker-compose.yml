services:
  web:
    build:
      context: .
      target: web
    ports:
      - "80:80"
    environment:
      - API_UPSTREAM=api:3000
      - SSR_UPSTREAM=ssr:4000
    depends_on:
      - api
      - ssr

  api:
    build:
      context: .
      target: api
    environment:
      - NODE_ENV=development
      # Opts in to dev-login and the _test/* routes the specs use; production never sets it.
      - ENABLE_DEV_AUTH=1
      - SESSION_SECRET
      - DATABASE_URL=postgres://postgres@postgres:5432/ocp_java
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - GITHUB_CALLBACK_URL
      - FRONTEND_URL
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_BUCKET=university-papers
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-localdev}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-localdev-secret}
    depends_on:
      - meilisearch
      - postgres
      - seaweedfs

  ssr:
    build:
      context: .
      target: ssr
    environment:
      - SSR_API_ORIGIN=http://web
      # The SSR server's SSRF allowlist (angular.json's build-time list only has the real
      # domain + localhost) otherwise rejects the Host header console-test sends when it
      # talks to this stack over the Docker network as `http://web/api`.
      - NG_ALLOWED_HOSTS=web

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=ocp_java
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql

  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    environment:
      - MEILI_MASTER_KEY
      - MEILI_NO_ANALYTICS=true
      # New DB directory instead of migrating: the index is rebuilt from the content on
      # every app boot, so the old v1.11 data.ms is simply left unused.
      - MEILI_DB_PATH=/meili_data/data-v1.54.ms
    volumes:
      - meili_data:/meili_data

  # S3-compatible object store for private uploads. With no s3.json, SeaweedFS turns
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY into a single identity, so no credentials file is
  # committed. The defaults below are for this local stack only; production keys live in the host's
  # s3.json (see backend/src/storage/README.md).
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # -ip is the address the cluster advertises to other containers (the init job below), so it
    # must be this service's name; 0.0.0.0 would point them back at themselves.
    command: server -dir=/data -ip=seaweedfs -s3 -s3.port=8333
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-localdev}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-localdev-secret}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-shot: creates the private bucket, then exits. Safe to run again.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["sh", "-c"]
    command:
      - echo "s3.bucket.create -name university-papers" | weed shell -master=seaweedfs:9333
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  console-test:
    image: node:24-alpine
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      # Keeps the container's Linux node_modules off the host: without it, `pnpm install` in here
      # overwrites ./backend/node_modules with binaries the host cannot run.
      - /workspace/node_modules
    environment:
      - API_URL=http://web/api
      - CI=true
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_BUCKET=university-papers
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-localdev}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-localdev-secret}
    command: sh -c "corepack enable && corepack prepare pnpm@11.3.0 --activate && pnpm install --frozen-lockfile && pnpm spec"
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
      # The specs hit the API through nginx, so both must actually be serving, not just started.
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    profiles:
      - test

volumes:
  postgres_data:
  meili_data:
  seaweedfs_data:
