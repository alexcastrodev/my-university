services:
  web:
    build:
      context: .
      target: web
    ports:
      - "80:80"
    environment:
      - API_UPSTREAM=api:3000
      - SSR_UPSTREAM=ssr:4000
    depends_on:
      - api
      - ssr

  api:
    build:
      context: .
      target: api
    environment:
      - NODE_ENV=development
      - SESSION_SECRET
      - DATABASE_URL=postgres://postgres@postgres:5432/ocp_java
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - GITHUB_CALLBACK_URL
      - FRONTEND_URL
    depends_on:
      - meilisearch
      - postgres

  ssr:
    build:
      context: .
      target: ssr
    environment:
      - SSR_API_ORIGIN=http://api:3000
      # The SSR server's SSRF allowlist (angular.json's build-time list only has the real
      # domain + localhost) otherwise rejects the Host header console-test sends when it
      # talks to this stack over the Docker network as `http://web/api`.
      - NG_ALLOWED_HOSTS=web

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=ocp_java
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - postgres_data:/var/lib/postgresql

  meilisearch:
    image: getmeili/meilisearch:v1.54
    environment:
      - MEILI_MASTER_KEY
      - MEILI_NO_ANALYTICS=true
      # New DB directory instead of migrating: the index is rebuilt from the content on
      # every app boot, so the old v1.11 data.ms is simply left unused.
      - MEILI_DB_PATH=/meili_data/data-v1.54.ms
    volumes:
      - meili_data:/meili_data

  console-test:
    image: node:24-alpine
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      - API_URL=http://web/api
      - CI=true
    command: sh -c "corepack enable && corepack prepare pnpm@11.3.0 --activate && pnpm install --frozen-lockfile && pnpm spec"
    depends_on:
      - web
    profiles:
      - test

volumes:
  postgres_data:
  meili_data:
