services:
  app:
    build: .
    ports:
      - "80:80"
    environment:
      - SESSION_SECRET
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY
    volumes:
      - postgres_data:/var/lib/postgresql
    depends_on:
      - meilisearch

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      - MEILI_MASTER_KEY
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data

  console-test:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    environment:
      - API_URL=http://app/api
      - CI=true
    command: sh -c "corepack enable && corepack prepare pnpm@11.3.0 --activate && pnpm install --frozen-lockfile && pnpm spec"
    depends_on:
      - app
    profiles:
      - test

volumes:
  postgres_data:
  meili_data:
