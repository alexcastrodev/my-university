minimumReleaseAgeExclude:
  - '@nestjs/platform-fastify@11.1.24'

allowBuilds:
  '@nestjs/core': true
  unrs-resolver: true

# @nestjs/platform-fastify 11.x pins fastify 5.11.3, which has known advisories
# (validation and auth bypasses) fixed in 5.12.5 (and 5.12.6 for GHSA-389g-gv7q-r4x8); same major, so it is forced here.
overrides:
  fastify: ^5.12.6
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
  'fast-uri@>=4.0.0 <4.2.3': '^4.2.3'

# Advisories accepted after review, with no patched release reachable yet:
# - GHSA-vfj7-8cjw-p6xm (braces): no fixed version published; only reached by
#   ts-loader at build time, never shipped in the production image.
# - GHSA-gcqx-w48m-w2h4 (deepmerge): advisory says patched in 4.3.2, but npm only has up to
#   4.3.1; only reached by @nestjs/cli (devDependency) via fork-ts-checker-webpack-plugin.
# - GHSA-3g3m-2fjr-6pw4 (glob, AbortSignal cancellation does not stop an async walk) and
#   GHSA-g3hv-75wg-m249 (minimatch, DoS through glob amplification): reached through
#   @nestjs/cli and eslint (dev tools) and through @sentry/bundler-plugins, which only
#   @sentry/node's webpack/rollup/vite entry points load; the backend imports only
#   @sentry/nestjs. Not reachable at runtime. The minimatch fix is 11.x, which breaks
#   callers still on 3.x, and glob 14 is a major bump for @nestjs/cli's build.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-gcqx-w48m-w2h4
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249
